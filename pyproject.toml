[project]
name = "comfyui-audio-quality-check"
description = "ComfyUI custom node for automated audio quality standards evaluation (LUFS, True Peak, Noise Floor, LRA, Dropout)"
version = "0.1.0"
license = { file = "LICENSE" }
authors = [
    { name = "khip01", email = "aakhifathallah24@gmail.com" }
]
dependencies = [
    "numpy",
    "scipy",
    "pyloudnorm",
    "soundfile",
]

[project.urls]
Repository = "https://github.com/Khip01/ComfyUI-AudioQualityCheck"

[tool.comfy]
PublisherId = "Khip01"
DisplayName = "Audio Quality Evaluator"
Icon = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
